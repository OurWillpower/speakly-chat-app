<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speakly - Global Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        
        <section id="setup-screen" style="display: flex; flex-direction: column;">
            <h1>🗣️ Welcome to Speakly-Chat!</h1>
            <p>Connect globally. Speak locally.</p>

            <div class="input-group">
                <label for="user-email">Email:</label>
                <input type="email" id="user-email" placeholder="you@example.com" required>
            </div>

            <div class="input-group">
                <label for="user-password">Password:</label>
                <input type="password" id="user-password" placeholder="Must be 6+ characters" required>
            </div>

            <div class="input-group">
                <label for="user-type">I am a:</label>
                <select id="user-type" required>
                    <option value="" disabled selected>Select Account Type</option>
                    <option value="individual">Individual</option>
                    <option value="business">Business</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="my-language">My Language (I Type In):</label>
                <input type="text" id="my-language" placeholder="e.g., Marathi, English, Chinese" required>
            </div>

            <button id="register-button">Register New Account</button>
            <button id="login-button" style="margin-top: 10px;">Login</button>

            <p class="security-note">🔒 **Security is our topmost priority.** All messages are encrypted end-to-end.</p>
        </section>

        <section id="chat-screen" style="display: none;">
            <header>
                <h2>🌍 Global Conversation</h2>
                <div>
                    <button id="new-chat-button" style="margin-right: 10px;">➕ New Chat</button>
                    <button id="logout-button">Logout</button>
                </div>
            </header>
            
            <div id="new-chat-container" style="padding: 15px; background-color: #2c3e50; display: none;">
                <input type="email" id="target-email-input" placeholder="Enter target user's email" style="width: 70%; padding: 8px; border-radius: 4px; border: 1px solid #7f8c8d; margin-right: 10px;">
                <button id="start-conversation-button" style="padding: 8px 10px;">Start Chat</button>
            </div>

            <div id="messages-container">
                <div class="system-message">Your chat is secure and running on **<span id="display-my-lang"></span>** (You). Use "New Chat" to select a partner.</div>
            </div>

            <footer id="input-area">
                <input type="text" id="chat-input" placeholder="Type your message here..." disabled>
                <button id="send-button" disabled>Send</button>
            </footer>
        </section>
    </div>

    <script src="script.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>

    <script>
        // !! IMPORTANT: REPLACE THE DUMMY CONFIG BELOW WITH YOUR REAL FIREBASE CONFIGURATION !!
        const firebaseConfig = {
          apiKey: "AIzaSy...YOUR...KEY", 
          authDomain: "speakly-chat.firebaseapp.com",
          projectId: "speakly-chat",
          storageBucket: "speakly-chat.appspot.com",
          messagingSenderId: "1234567890",
          appId: "1:1234567890:web:abcdef123456"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        
        // Export the services we will use in script.js
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // Settings for better compatibility/real-time performance
        db.settings({ experimentalForceLongPolling: true }); 
    </script>
</body>
</html>
