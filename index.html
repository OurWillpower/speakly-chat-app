<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speakly - Global Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        
        <section id="setup-screen">
            <h1>🗣️ Welcome to Speakly!</h1>
            <p>Connect globally. Speak locally.</p>

            <div class="input-group">
                <label for="user-type">I am a:</label>
                <select id="user-type" required>
                    <option value="" disabled selected>Select Account Type</option>
                    <option value="individual">Individual</option>
                    <option value="business">Business</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="my-language">My Language (I Type In):</label>
                <input type="text" id="my-language" placeholder="e.g., Marathi, English, Hindi" required>
            </div>

            <button id="start-chat-button">Start Secure Chat</button>

            <p class="security-note">🔒 **Security is our topmost priority.** All messages are encrypted end-to-end.</p>
        </section>

        <section id="chat-screen" style="display: none;">
            <header>
                <h2>🌍 Global Conversation</h2>
                <button id="logout-button">Logout</button>
            </header>

            <div id="messages-container">
                <div class="system-message">Your chat is secure and running on **<span id="display-my-lang"></span>** (You) and **<span id="display-their-lang"></span>** (Them).</div>
            </div>

            <footer id="input-area">
                <input type="text" id="chat-input" placeholder="Type your message here..." disabled>
                <button id="send-button" disabled>Send</button>
            </footer>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
