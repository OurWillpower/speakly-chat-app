<section id="setup-screen" style="display: flex; flex-direction: column;">
    <h1>🗣️ Welcome to Speakly-Chat!</h1>
    <p>Connect globally. Speak locally.</p>

    <div class="input-group">
        <label for="user-email">Email:</label>
        <input type="email" id="user-email" placeholder="you@example.com" required>
    </div>

    <div class="input-group">
        <label for="user-password">Password:</label>
        <input type="password" id="user-password" placeholder="Must be 6+ characters" required>
    </div>

    <div class="input-group">
        <label for="user-type">I am a:</label>
        <select id="user-type" required>
            <option value="" disabled selected>Select Account Type</option>
            <option value="individual">Individual</option>
            <option value="business">Business</option>
        </select>
    </div>
    
    <div class="input-group">
        <label for="my-language">My Language (I Type In):</label>
        <input type="text" id="my-language" placeholder="e.g., Marathi, English, Chinese" required>
    </div>

    <button id="register-button">Register New Account</button>
    <button id="login-button" style="margin-top: 10px;">Login</button>

    <p class="security-note">🔒 **Security is our topmost priority.** All messages are encrypted end-to-end.</p>
</section>
